trigger: none
pr: none

parameters:
  - name: azureServiceConnection
    type: string
  - name: subscriptionId
    type: string
  - name: location
    type: string
    default: centralus
  - name: parametersFile
    type: string
    default: AzureVirtualDesktopPoc/infra/parameters/hybrid-poc.bicepparam

stages:
  - stage: Validate
    jobs:
      - job: BicepAndWhatIf
        pool:
          vmImage: windows-latest
        steps:
          - task: AzureCLI@2
            displayName: Validate hybrid Bicep and reject destructive changes
            inputs:
              azureSubscription: ${{ parameters.azureServiceConnection }}
              scriptType: pscore
              scriptLocation: inlineScript
              inlineScript: |
                $ErrorActionPreference = 'Stop'
                New-Item -ItemType Directory -Path '$(Build.ArtifactStagingDirectory)/hybrid-platform' -Force | Out-Null
                az account set --subscription '${{ parameters.subscriptionId }}'
                az bicep build --file 'AzureVirtualDesktopPoc/infra/hybrid-main.bicep'
                if ($LASTEXITCODE -ne 0) { throw 'Hybrid Bicep compilation failed.' }
                $whatIf = az deployment sub what-if `
                  --name "avd-hybrid-whatif-$(Build.BuildId)" `
                  --location '${{ parameters.location }}' `
                  --subscription '${{ parameters.subscriptionId }}' `
                  --parameters '${{ parameters.parametersFile }}' `
                  --result-format FullResourcePayloads `
                  --no-pretty-print `
                  --output json `
                  --only-show-errors
                if ($LASTEXITCODE -ne 0) { throw 'Hybrid platform what-if failed.' }
                $text = $whatIf -join [Environment]::NewLine
                $text | Set-Content '$(Build.ArtifactStagingDirectory)/hybrid-platform/what-if.json' -Encoding utf8
                $whatIfResult = $text | ConvertFrom-Json -Depth 100
                if (@($whatIfResult.changes | Where-Object changeType -In @('Delete', 'Recreate')).Count -gt 0) {
                  throw 'Hybrid platform what-if contains a delete or recreate operation.'
                }
          - task: PublishPipelineArtifact@1
            condition: always()
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)/hybrid-platform
              artifact: avd-hybrid-platform-what-if

  - stage: Deploy
    dependsOn: Validate
    condition: succeeded()
    jobs:
      - deployment: AdditiveHybridPlatform
        environment: avd-poc-hybrid-platform
        pool:
          vmImage: windows-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: AzureCLI@2
                  displayName: Deploy hybrid foundation and add app group to workspace
                  inputs:
                    azureSubscription: ${{ parameters.azureServiceConnection }}
                    scriptType: pscore
                    scriptLocation: inlineScript
                    inlineScript: |
                      $ErrorActionPreference = 'Stop'
                      $deployment = az deployment sub create `
                        --name "avd-hybrid-platform-$(Build.BuildId)" `
                        --location '${{ parameters.location }}' `
                        --subscription '${{ parameters.subscriptionId }}' `
                        --parameters '${{ parameters.parametersFile }}' `
                        --output json `
                        --only-show-errors | ConvertFrom-Json -Depth 100
                      if ($LASTEXITCODE -ne 0) { throw 'Additive hybrid deployment failed.' }
                      & 'AzureVirtualDesktopPoc/scripts/Add-AvdApplicationGroupToWorkspace.ps1' `
                        -SubscriptionId '${{ parameters.subscriptionId }}' `
                        -WorkspaceResourceGroupName $deployment.properties.outputs.existingWorkspaceResourceGroupName.value `
                        -WorkspaceName $deployment.properties.outputs.existingWorkspaceName.value `
                        -ApplicationGroupId $deployment.properties.outputs.desktopAppGroupId.value
