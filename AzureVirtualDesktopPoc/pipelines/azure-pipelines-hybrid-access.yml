trigger: none
pr: none

parameters:
  - name: privilegedBootstrapServiceConnection
    type: string
  - name: subscriptionId
    type: string
  - name: location
    type: string
    default: centralus
  - name: pocId
    type: string
    default: POC01
  - name: resourceGroupName
    type: string
    default: rg-avd-hybrid-poc01
  - name: deploymentPrincipalId
    type: string
  - name: readinessPrincipalId
    type: string
  - name: assignmentPrincipalId
    type: string

stages:
  - stage: Access
    displayName: Create hybrid POC no-delete roles
    jobs:
      - deployment: AdditiveHybridAccessBootstrap
        environment: avd-poc-hybrid-access-bootstrap
        pool:
          vmImage: windows-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: AzureCLI@2
                  displayName: What-if and deploy hybrid access roles
                  env:
                    SUBSCRIPTION_ID: ${{ parameters.subscriptionId }}
                    LOCATION: ${{ parameters.location }}
                    POC_ID: ${{ parameters.pocId }}
                    RESOURCE_GROUP: ${{ parameters.resourceGroupName }}
                    DEPLOYMENT_PRINCIPAL_ID: ${{ parameters.deploymentPrincipalId }}
                    READINESS_PRINCIPAL_ID: ${{ parameters.readinessPrincipalId }}
                    ASSIGNMENT_PRINCIPAL_ID: ${{ parameters.assignmentPrincipalId }}
                  inputs:
                    azureSubscription: ${{ parameters.privilegedBootstrapServiceConnection }}
                    scriptType: pscore
                    scriptLocation: inlineScript
                    inlineScript: |
                      $ErrorActionPreference = 'Stop'
                      New-Item -ItemType Directory -Path '$(Build.ArtifactStagingDirectory)/hybrid-access' -Force | Out-Null
                      $common = @(
                        "pocId=$env:POC_ID"
                        "resourceGroupName=$env:RESOURCE_GROUP"
                        "deploymentPrincipalId=$env:DEPLOYMENT_PRINCIPAL_ID"
                        "readinessPrincipalId=$env:READINESS_PRINCIPAL_ID"
                        "assignmentPrincipalId=$env:ASSIGNMENT_PRINCIPAL_ID"
                      )
                      $whatIf = az deployment sub what-if `
                        --name "avd-hybrid-access-whatif-$(Build.BuildId)" `
                        --location $env:LOCATION --subscription $env:SUBSCRIPTION_ID `
                        --template-file 'AzureVirtualDesktopPoc/infra/hybrid-access.bicep' `
                        --parameters @common --result-format FullResourcePayloads --no-pretty-print --output json --only-show-errors
                      if ($LASTEXITCODE -ne 0) { throw 'Hybrid access what-if failed.' }
                      $text = $whatIf -join [Environment]::NewLine
                      $text | Set-Content '$(Build.ArtifactStagingDirectory)/hybrid-access/what-if.json' -Encoding utf8
                      $whatIfResult = $text | ConvertFrom-Json -Depth 100
                      if (@($whatIfResult.changes | Where-Object changeType -In @('Delete', 'Recreate')).Count -gt 0) {
                        throw 'Hybrid access what-if contains a delete or recreate operation.'
                      }
                      az deployment sub create `
                        --name "avd-hybrid-access-$(Build.BuildId)" `
                        --location $env:LOCATION --subscription $env:SUBSCRIPTION_ID `
                        --template-file 'AzureVirtualDesktopPoc/infra/hybrid-access.bicep' `
                        --parameters @common --output none --only-show-errors
                      if ($LASTEXITCODE -ne 0) { throw 'Hybrid access bootstrap failed.' }
                - task: PublishPipelineArtifact@1
                  condition: always()
                  inputs:
                    targetPath: $(Build.ArtifactStagingDirectory)/hybrid-access
                    artifact: avd-hybrid-access-what-if
